[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/pyfloq",
    "examples/count_words",
    "examples/embeddings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
floq = { path = "crates/core" }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures = "0.3"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
rs-car = "0.4"
bytes = "1.5"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
regex = "1.10"
rumqttc = { version = "0.24", features = ["websocket", "url"] }
chrono = "0.4"
thiserror = "1.0"
